# One place for the security headers, included in the server block *and* in every
# location that sets its own add_header — nginx drops inherited headers in those.
# /sw.js, /signup and /index.html were serving without them for exactly that reason.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Enforced: scripts are same-origin files only, no eval, no frames, no plugins.
# 'wasm-unsafe-eval' is required: the password is hashed in the browser with Argon2
# (hash-wasm), and WebAssembly compilation is blocked by script-src without it. That
# broke sign-in completely — the client threw before sending anything.
# `img-src https:` stays open on purpose — HTML mail carries remote images, and a
# policy that silently ate every picture in the inbox would be a regression dressed
# up as hardening. Referrer-Policy already stops the URL leaking to those hosts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://keys.openpgp.org; media-src 'self' blob:; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /csp-report" always;
