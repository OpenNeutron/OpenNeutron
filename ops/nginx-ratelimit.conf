# Edge throttle for credential guessing (http context).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
# Public endpoints: signup is open to the internet, so it must be throttled.
limit_req_zone $binary_remote_addr zone=waitlist:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=register:10m rate=5r/m;
# Password reset and recovery-key redemption are unauthenticated. A valid
# recovery key is 160 bits so guessing is hopeless, but the endpoints still must
# not be a free CPU/bandwidth amplifier (argon2 + RSA work happens client-side,
# and every attempt costs a lookup here).
limit_req_zone $binary_remote_addr zone=account_recovery:10m rate=10r/m;

# The appeal form is the one unauthenticated surface that takes files (30 MB). A
# person files one appeal, so a tight envelope costs a human nothing and a script
# the ability to fill the disk.
limit_req_zone $binary_remote_addr zone=appeal:10m rate=10r/m;

# The owner console's unlock runs scrypt on every attempt. A 12-character code is
# not guessable, but the hashing should not be free to a stranger either.
limit_req_zone $binary_remote_addr zone=owner_login:10m rate=5r/m;
