# Hand systemd-resolved the validating resolver, so every program on this host —
# Postfix included — sees the AD bit without anyone changing resolv.conf. Docker
# reads /etc/resolv.conf when it builds a container's resolver, and 127.0.0.1 there
# would point at the container itself, not at this machine.
[Resolve]
DNS=127.0.0.1
Domains=~.
DNSSEC=allow-downgrade
